# Local development stack: postgres :5432, backend :8000, frontend :3000.
# Every variable below has a working default, so `docker compose up --build`
# succeeds on a clean clone with no .env file. Copy .env.example to .env to
# add an ANTHROPIC_API_KEY or override anything.

services:
  # ---------------------------------------------------------------- database
  db:
    image: postgres:13-alpine
    container_name: sabermetric_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=baseball_db
      # Credentials for the SELECT-only role used by the NL->SQL path.
      - NL2SQL_RO_USER=${NL2SQL_RO_USER:-nl2sql_ro}
      - NL2SQL_RO_PASSWORD=${NL2SQL_RO_PASSWORD:-nl2sql_ro}
    ports:
      # Host access for the data_pipeline loaders (which run outside compose).
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-boot provisioning of the read-only NL->SQL role (fresh volumes
      # only; the backend re-runs the same idempotent provisioning at startup).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  # ----------------------------------------------------------------- backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sabermetric_backend
    ports:
      - "8000:8000"
    volumes:
      # Source mount + --reload: development posture, not production.
      - ./backend:/app
    environment:
      # Compose-network form. Host-side loaders need the localhost form instead
      # (see README "Quick start").
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://user:password@db:5432/baseball_db}
      - NL2SQL_RO_USER=${NL2SQL_RO_USER:-nl2sql_ro}
      - NL2SQL_RO_PASSWORD=${NL2SQL_RO_PASSWORD:-nl2sql_ro}
      # Optional full override if the read-only role lives on another host.
      - READONLY_DATABASE_URL=${READONLY_DATABASE_URL:-}
      # Optional: without a key both LLM paths fall back to rule-based parsing.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # Comma-separated origins; unset means "*" with credentials disabled.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    restart: unless-stopped

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sabermetric_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    # Create React App's dev server wants a TTY.
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:
